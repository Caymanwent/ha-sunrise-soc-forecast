type: markdown
content: |
  {% set pre_sunrise = state_attr('sensor.predicted_sunrise_soc_day_1', 'mode') == 'nighttime' and now().hour < 12 -%}
  | Day | Status | SoC % | kWh | Day Low | Floor | Solcast | Daytime | Backup | Main Full | Backup Full |
  |-----|--------|-------|-----|---------|-------|---------|---------|--------|-----------|-------------|
  {%- set d1 = 'sensor.predicted_sunrise_soc_day_1' %}
  {%- set d2 = 'sensor.predicted_sunrise_soc_day_2' %}
  | {% if pre_sunrise %}This Morning{% else %}Tomorrow{% endif %} | {% if states(d1) | float(0) < 5 %}🔴{% elif states(d1) | float(0) < 15 %}🟡{% else %}🟢{% endif %} | {{ states(d1) }}% | {{ state_attr(d1, 'predicted_kwh') }}  | {{ state_attr(d2, 'morning_low_pct') }}% | {% if state_attr(d2, 'floor_hour') and state_attr(d2, 'night_floor_hour') %}{{ state_attr(d2, 'floor_hour') }}, {{ state_attr(d2, 'night_floor_hour') }}{% elif state_attr(d2, 'floor_hour') %}{{ state_attr(d2, 'floor_hour') }}{% elif state_attr(d2, 'night_floor_hour') %}{{ state_attr(d2, 'night_floor_hour') }}{% else %}—{% endif %} | {{ state_attr(d1, 'remaining_solar_kwh') }}  | {{ state_attr(d1, 'daytime_consumption_kwh') }}  | {{ state_attr(d1, 'backup_charged_kwh') }}  | {{ state_attr(d1, 'main_full_hour') or '—' }} | {{ state_attr(d1, 'backup_full_hour') or '—' }} |
  {% for d in range(2, 8) if has_value('sensor.predicted_sunrise_soc_day_' ~ d) -%}
  {% set date = (now() + timedelta(days=d - 1 if pre_sunrise else d)).strftime('%a %-d %b') -%}
  {% set e = 'sensor.predicted_sunrise_soc_day_' ~ d -%}
  {% set soc = states(e) | float(0) -%}
  {% set next_e = 'sensor.predicted_sunrise_soc_day_' ~ (d+1) if d < 7 and has_value('sensor.predicted_sunrise_soc_day_' ~ (d+1)) else '' -%}
  | {{ date }} | {% if soc < 5 %}🔴{% elif soc < 15 %}🟡{% else %}🟢{% endif %} | {{ soc }}% | {{ state_attr(e, 'predicted_kwh') }}  | {% if next_e %}{{ state_attr(next_e, 'morning_low_pct') }}%{% else %}—{% endif %} | {% if next_e %}{% if state_attr(next_e, 'floor_hour') and state_attr(next_e, 'night_floor_hour') %}{{ state_attr(next_e, 'floor_hour') }}, {{ state_attr(next_e, 'night_floor_hour') }}{% elif state_attr(next_e, 'floor_hour') %}{{ state_attr(next_e, 'floor_hour') }}{% elif state_attr(next_e, 'night_floor_hour') %}{{ state_attr(next_e, 'night_floor_hour') }}{% else %}—{% endif %}{% else %}—{% endif %} | {{ state_attr(e, 'solcast_kwh') }}  | {{ state_attr(e, 'daytime_consumption_kwh') }}  | {{ state_attr(e, 'backup_charged_kwh') }}  | {{ state_attr(e, 'main_full_hour') or '—' }} | {{ state_attr(e, 'backup_full_hour') or '—' }} |
  {% endfor %}

  {% if state_attr(d1, 'mode') == 'daytime' %}
  Mode: ☀️ Daytime | Remaining solar: {{ state_attr(d1, 'remaining_solar_kwh') }} | Hours to sunset: {{ ((as_datetime(state_attr('sun.sun', 'next_setting')) - now()).total_seconds() / 3600) | round(1) }}h{% if states('sensor.predicted_batteries_full') not in ['unknown', 'unavailable', 'none', ''] %} | Both full: {{ (states('sensor.predicted_batteries_full') | as_datetime | as_local).strftime('%a %H:%M') }}{% endif %}
  {% else %}
  Mode: 🌙 Nighttime | Backup: {{ state_attr(d1, 'backup_charged_kwh') }}{% if states('sensor.predicted_batteries_full') not in ['unknown', 'unavailable', 'none', ''] %} | Next both full: {{ (states('sensor.predicted_batteries_full') | as_datetime | as_local).strftime('%a %H:%M') }}{% endif %}
  {% endif %}
  {% set hourly = state_attr('sensor.7_day_average_daily_consumption', 'hourly_averages') -%}
  {% if hourly -%}
  {% set ss = state_attr('sun.sun', 'next_setting') | as_datetime | as_local -%}
  {% set sr = state_attr('sun.sun', 'next_rising') | as_datetime | as_local -%}
  {% set ss_h = ss.hour + ss.minute / 60 -%}
  {% set sr_h = sr.hour + sr.minute / 60 -%}
  {% set ss_int = ss_h | int -%}
  {% set sr_int = sr_h | int -%}
  {% set ns = namespace(overnight=0) -%}
  {% set ns.overnight = ns.overnight + hourly[ss_int] * (1 - (ss_h - ss_int)) -%}
  {% for h in range(ss_int + 1, ss_int + 24) -%}
  {%- if h % 24 == sr_int %}{% break %}{% endif -%}
  {% set ns.overnight = ns.overnight + hourly[h % 24] -%}
  {% endfor -%}
  {% set ns.overnight = ns.overnight + hourly[sr_int] * (sr_h - sr_int) -%}
  {% endif -%}
  *{% if state_attr(d1, 'using_fallback') %}⚠️ Using estimated consumption (fallback values){% else %}✅ Using 7-day averages (daily: {% if hourly %}{{ hourly | sum | round(1) }}{% else %}{{ states('sensor.7_day_average_daily_consumption') | round(1) }}{% endif %} kWh / overnight: {% if hourly %}{{ ns.overnight | round(1) }}{% else %}{{ states('sensor.7_day_average_overnight_consumption') | round(1) }}{% endif %} kWh){% endif %}*
